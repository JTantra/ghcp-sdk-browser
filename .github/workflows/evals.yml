name: evals

# Batch evaluation of the deployed ghcp-sdk-browser agent.
#
# OIDC app: ghcp-sdk-browser-evals in the new ASEANInnovationHub tenant.
# Federated subjects must match the repository's actual OIDC sub_claim_prefix
# (including immutable owner/repo IDs), plus the branch or pull_request suffix.
# NEWSUB_* variables isolate this migration from master's old-tenant workflow.
# Required repo variables:
#   NEWSUB_AZURE_CLIENT_ID, NEWSUB_AZURE_TENANT_ID, NEWSUB_AZURE_SUBSCRIPTION_ID
#   NEWSUB_PROJECT_ENDPOINT, NEWSUB_AGENT_BASE_URL, NEWSUB_JUDGE_ENDPOINT
#   AZURE_RESOURCE_GROUP (job summary portal link only)
# No agent deployment happens in this workflow.

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Row ids to run (blank = all 10)"
        required: false
        default: ""
      gate:
        description: "Fail the job if thresholds are breached"
        type: boolean
        default: true
  pull_request:
    paths:
      - "server/**"
      - "evals/**"
      - ".github/workflows/evals.yml"

# OIDC needs id-token: write. contents: read is the default-deny baseline.
permissions:
  id-token: write
  contents: read

concurrency:
  # One eval at a time per ref: concurrent runs would compete for agent
  # sessions and model quota, and slow rows would time out.
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # Full agent turns are slow (~40s/row incl. subagents + browser relay).
    timeout-minutes: 45

    env:
      # Explicit runtime overrides win over the local .env example.
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.NEWSUB_AZURE_SUBSCRIPTION_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.NEWSUB_PROJECT_ENDPOINT }}
      AGENT_BASE_URL: ${{ vars.NEWSUB_AGENT_BASE_URL }}
      JUDGE_ENDPOINT: ${{ vars.NEWSUB_JUDGE_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 3.14 is too new for the Azure SDKs

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.NEWSUB_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.NEWSUB_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.NEWSUB_AZURE_SUBSCRIPTION_ID }}

      - name: Install deps
        working-directory: evals
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure
        working-directory: evals
        run: |
          test -n "$AZURE_AI_PROJECT_ENDPOINT"
          test -n "$AGENT_BASE_URL"
          test -n "$JUDGE_ENDPOINT"
          test "$(az account show --query id -o tsv)" = "$AZURE_SUBSCRIPTION_ID"
          echo "Foundry project: $AZURE_AI_PROJECT_ENDPOINT"
          echo "Agent under test: $AGENT_BASE_URL"
          echo "Judge endpoint: $JUDGE_ENDPOINT"
          cp judge_model.env.example .env

      - name: Run evaluation
        working-directory: evals
        run: |
          # PRs run a slim, delegation-sensitive subset to keep judge cost and
          # wall time down; dispatch runs whatever was asked for (default all).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ROWS="board-read-count,full-recovery-brief,crane-realloc-capacity-guard,carrier-policy-grounding"
            NAME="pr-${{ github.event.number }}-${{ github.run_number }}"
          else
            ROWS="${{ inputs.rows }}"
            NAME="ci-${{ github.run_number }}"
          fi

          ARGS="--name $NAME"
          [ -n "$ROWS" ] && ARGS="$ARGS --only $ROWS"
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.gate }}" = "true" ]; then
            ARGS="$ARGS --gate"
          fi

          # The publish step needs this to locate results/<name>.json, and it
          # runs even when the gate fails -- so export before running, not after.
          echo "EVAL_NAME=$NAME" >> "$GITHUB_ENV"

          echo "run_eval.py $ARGS"
          set +e
          python run_eval.py $ARGS
          code=$?
          set -e
          # 0 = pass, 1 = threshold breach, 2 = harness/infra failure.
          # 2 is NOT a quality regression -- surface it as such rather than
          # letting a dead backend look like the agent got worse.
          if [ $code -eq 2 ]; then
            echo "::error::Eval harness could not reach the agent (upstream failure). Scores are not meaningful."
          elif [ $code -eq 1 ]; then
            echo "::error::Eval thresholds breached -- see the job summary."
          fi
          exit $code

      - name: Publish to Foundry portal
        # always(): a gate failure is exactly when you want the run visible in
        # the portal. Never fails the job -- publishing is reporting, not a
        # quality signal, and a portal outage must not mask a green eval.
        if: always()
        working-directory: evals
        continue-on-error: true
        run: |
          if [ ! -f "results/$EVAL_NAME.json" ]; then
            echo "::warning::no results/$EVAL_NAME.json -- nothing to publish"
            exit 0
          fi
          # continue-on-error hides a crash behind a green job, so surface it
          # as an annotation: the first CI publish died on a missing env var
          # and the run still reported success.
          if ! python publish_to_evals_api.py "results/$EVAL_NAME.json"; then
            echo "::warning::Publishing to the Foundry portal failed -- scores are still in the job summary and the artifact."
          fi

      - name: Upload results
        # always(): the artifact is most valuable precisely when the gate failed.
        # results/ is gitignored, so this is also the only durable copy.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_number }}
          path: evals/results/*.json
          retention-days: 30
