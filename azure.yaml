# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ghcp-sdk-browser
metadata:
    template: ghcp-sdk-browser@0.1.0
services:
    ghcp-sdk-browser:
        project: .
        host: azure.ai.agent
        language: docker
        docker:
            path: infra/Dockerfile
            context: .
            remoteBuild: true
        uses:
            - jtantra-test-foundry
        container:
            resources:
                cpu: "2"
                memory: 4Gi
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: GITHUB_TOKEN
              value: ${GITHUB_TOKEN}
            - name: COPILOT_MODEL
              value: ${COPILOT_MODEL}
            # The hosted runtime does NOT inject this, so the exporter fell
            # back to console and no span ever reached Foundry -- the portal
            # showed only the platform's own 11ms invoke_agent wrapper. This
            # is the project's attached App Insights (appInsights-connection-8822).
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
            # Foundry renders agent traces only when the GenAI semantic
            # conventions are opted into.
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: gen_ai_latest_experimental
            - name: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING
              value: "true"
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "true"
        kind: hosted
        name: ghcp-sdk-browser
        protocols:
            - protocol: invocations
              version: 1.0.0
            - protocol: invocations_ws
              version: 1.0.0
    jtantra-test-foundry:
        host: azure.ai.project
        endpoint: https://jtantra-test-foundry.services.ai.azure.com/api/projects/jtantra-test-foundry
