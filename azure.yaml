# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ghcp-sdk-browser
metadata:
    template: ghcp-sdk-browser@0.1.0
services:
    ghcp-sdk-browser:
        project: .
        host: azure.ai.agent
        language: docker
        docker:
            path: infra/Dockerfile
            context: .
            remoteBuild: true
        uses:
            - jtantra-test-foundry
        container:
            resources:
                cpu: "2"
                memory: 4Gi
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: GITHUB_TOKEN
              value: ${GITHUB_TOKEN}
            - name: COPILOT_MODEL
              value: ${COPILOT_MODEL}
        kind: hosted
        name: ghcp-sdk-browser
        protocols:
            - protocol: invocations
              version: 1.0.0
            - protocol: invocations_ws
              version: 1.0.0
    jtantra-test-foundry:
        host: azure.ai.project
        endpoint: https://jtantra-test-foundry.services.ai.azure.com/api/projects/jtantra-test-foundry
