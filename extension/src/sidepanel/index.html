<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Fleet Ops Agent</title>
<link rel="stylesheet" href="./panel.css"/>
</head>
<body>
  <header>
    <div class="title">Fleet Ops Agent</div>
    <div class="conn"><span id="dot" class="dot"></span><span id="state">connecting…</span></div>
  </header>

  <details class="setup" id="setupBox">
    <summary>Endpoint &amp; sign-in</summary>
    <label>Agent endpoint
      <input id="backend" spellcheck="false" placeholder="https://…/protocols/invocations"/>
    </label>
    <label>Client ID
      <input id="clientId" spellcheck="false" placeholder="Entra app (client) ID"/>
    </label>
    <label>Tenant ID
      <input id="tenantId" spellcheck="false" placeholder="Directory (tenant) ID"/>
    </label>
    <div class="row">
      <button id="save">Save</button>
      <button id="signin">Sign in</button>
      <button id="signout" class="ghost">Sign out</button>
    </div>
    <div class="row">
      <button id="connect">Connect</button>
      <button id="disconnect" class="ghost">Disconnect</button>
      <button id="newsession" class="ghost">New session</button>
      <button id="uselocal" class="ghost" title="Point at a locally running server">Use local</button>
    </div>
    <div id="authstate" class="hint">not signed in</div>
  </details>

  <div class="quick">
    <button class="chip" data-p="Review the shipment board and draft a recovery brief for the top 3 at-risk shipments.">Recovery brief</button>
    <button class="chip" data-p="Read the shipment table and tell me how many shipments are delayed, at risk, and on time.">Board summary</button>
    <button class="chip" data-p="Filter the board to Delayed only, then list the vessels and their delay hours.">Filter delayed</button>
  </div>

  <div id="log" class="log"></div>

  <div class="composer">
    <textarea id="input" rows="2" placeholder="Ask the agent…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
